    function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise(resolve => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = e => {
      img.src = e.target.result;
    };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const scale = maxWidth / img.width;
      canvas.width = maxWidth;
      canvas.height = img.height * scale;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      resolve(canvas.toDataURL("image/jpeg", quality));
    };

    reader.readAsDataURL(file);
  });
}

  const loadingEl = document.getElementById("loading-text");

  if(chartEl) chartEl.style.opacity = "0.5";

  let formattedDate;
  const dateInput = document.getElementById("dashboard-date");

  }

  document.getElementById("selected-date").innerText = formattedDate;

  // 👇 ต้องอยู่ใน function นี้
  const staffRef = query(
    collection(db, "staffmeal"),
    where("date", "==", formattedDate)
  );

  unsubscribeDashboard = onSnapshot(staffRef, snapshot => {
    const todayData = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    excelData = todayData;

    document.getElementById("total-staff").innerText = todayData.length;
    document.getElementById("total-meals").innerText =
  todayData.reduce((sum, x) => {
    return sum + (Array.isArray(x.meals) ? x.meals.length : 0);
  }, 0);

    const table = document.getElementById("dashboard-table");
table.innerHTML = "";

// 👉 เรียงตามแผนกก่อน
todayData.sort((a, b) => a.dept.localeCompare(b.dept));

// 👉 หาแผนกทั้งหมด
const depts = [...new Set(todayData.map(x => x.dept))];

depts.forEach(dept => {

  // 🔹 หัวข้อแผนก
  let headerRow = document.createElement("tr");
  headerRow.innerHTML = `
    <td colspan="5" style="
  background:#f3e5d8;
  color:#6d4c41;
  font-weight:bold;

  padding:14px;
  font-size:18px;

">

    <th>Meals</th>
    <th>Time</th>

  // 🔹 data ของแผนกนั้น
  todayData

    .reverse()
    .forEach(x => {

      let row = document.createElement("tr");

      row.innerHTML = `
        <td>${x.name}</td>

        <td>${Array.isArray(x.meals) ? x.meals.join(", ") : "-"}</td>

          <button onclick="deleteData('${x.id}')">Delete</button>
        </td>
      `;

      table.appendChild(row);
    });

});

    const mealCounts = { Morning:0, Noon:0, Evening:0, Night:0 };

    todayData.forEach(x =>
      x.meals.forEach(m => {
        if(mealCounts[m] !== undefined) mealCounts[m]++;
      })
    );

    document.getElementById("count-morning").innerText = mealCounts.Morning;
    document.getElementById("count-noon").innerText = mealCounts.Noon;
    document.getElementById("count-evening").innerText = mealCounts.Evening;
    document.getElementById("count-night").innerText = mealCounts.Night;

    const ctx = chartEl.getContext("2d");
    const gradient = ctx.createLinearGradient(0,0,0,300);

gradient.addColorStop(0,'#ffb347');
gradient.addColorStop(1,'#ffcc33');

    if (mealsChart) mealsChart.destroy();

    mealsChart = new Chart(ctx, {
      type: 'bar',

  label:'Number of Meals',

 backgroundColor:[

}

    chartEl.style.opacity = "1";
  });
}

  });

  // 👇 listen พรุ่งนี้
  const unsubTomorrow = onSnapshot(tomorrowQuery, snapshot => {
    tomorrowCounts = { Morning:0, Noon:0, Evening:0, Night:0 };

    snapshot.forEach(doc => {
      const data = doc.data();
      data.meals.forEach(m => {
        if(tomorrowCounts[m] !== undefined) tomorrowCounts[m]++;
      });
    });

    // update UI พรุ่งนี้
    document.getElementById("tomorrow-morning").innerText = tomorrowCounts.Morning;
    document.getElementById("tomorrow-noon").innerText = tomorrowCounts.Noon;
    document.getElementById("tomorrow-evening").innerText = tomorrowCounts.Evening;

}

          </label>

          <button class="edit-cancel" onclick="closeEditModal()">Cancel</button>
          <button onclick="saveEditedData()">💾 Save</button>
        </div>
      </div>
    </div>
  `);

  document.querySelectorAll("#adminEditModal .edit-meals input").forEach(cb => {
    cb.addEventListener("change", () => {
      const checked = document.querySelectorAll("#adminEditModal .edit-meals input:checked");
      if(checked.length > 2){
        cb.checked = false;
        alert("เลือกได้สูงสุด 2 มื้อ");

window.editData = async function(id){
  try{
    const snap = await getDoc(doc(db, "staffmeal", id));

    if(!snap.exists()){
      alert("ไม่พบข้อมูลรายการนี้");
      return;
    }

    const data = snap.data();

    ensureEditModal();

    document.getElementById("editDocId").value = id;
    document.getElementById("editName").value = data.name || "";
    document.getElementById("editDept").value = data.dept || "";

    document.querySelectorAll("#adminEditModal .edit-meals input").forEach(cb => {
      cb.checked = Array.isArray(data.meals) && data.meals.includes(cb.value);
    });

    document.getElementById("adminEditModal").style.display = "flex";
    document.body.style.overflow = "hidden";

    setTimeout(() => document.getElementById("editName")?.focus(), 100);
  }catch(err){
    console.error(err);
    alert("เปิดข้อมูลเพื่อแก้ไขไม่ได้: " + err.message);
  }
};

window.closeEditModal = function(){
  const modal = document.getElementById("adminEditModal");
  if(modal) modal.style.display = "none";
  document.body.style.overflow = "";
};

window.saveEditedData = async function(){
  const id = document.getElementById("editDocId")?.value;
  const name = document.getElementById("editName")?.value.trim();
  const dept = document.getElementById("editDept")?.value;
  const meals = [...document.querySelectorAll("#adminEditModal .edit-meals input:checked")]
    .map(cb => cb.value);

  if(!id){
    alert("ไม่พบรายการที่ต้องการแก้ไข");
    return;
  }

  if(!name || !dept){
    alert("กรุณากรอกชื่อและแผนกให้ครบ");
    return;
  }

  if(meals.length === 0 || meals.length > 2){
    alert("กรุณาเลือก 1-2 มื้อ");
    return;
  }

  const saveBtn = document.querySelector("#adminEditModal .edit-actions button:last-child");
  if(saveBtn){
    saveBtn.disabled = true;
    saveBtn.innerText = "⏳ Saving...";
  }

  try{
    await setDoc(doc(db, "staffmeal", id), {
      name,
      dept,
      meals
    }, { merge:true });

    closeEditModal();
    alert("✅ Updated successfully");
  }catch(err){
    console.error(err);
    alert("บันทึกข้อมูลไม่ได้: " + err.message);
  }finally{
    if(saveBtn){
      saveBtn.disabled = false;
      saveBtn.innerText = "💾 Save";
    }
  }
};

window.deleteData = async function(id){
  if(!confirm("ต้องการลบรายการนี้ใช่ไหม?")) return;

  try{
    await deleteDoc(doc(db, "staffmeal", id));
    alert("🗑️ Deleted successfully");
  }catch(err){
    console.error(err);
    alert("ลบข้อมูลไม่ได้: " + err.message);
  }
};

        <td>${grandTotal.Morning + grandTotal.Noon + grandTotal.Evening + grandTotal.Night}</td>
      </tr>
    </table>
  </div>
`;

    document.getElementById("viewList").innerHTML = html;
  });
}

window.goStaff = function(){
  location.hash = "";
  mode = "";
  renderPage();
};

window.deleteAnnouncement = async function(){
  if(confirm("ลบประกาศวันนี้?")){
    await deleteDoc(doc(db,"announcements", formatDate()));
    alert("🗑️ Deleted");
  }
};

window.switchTab = function(tab){
  currentTab = tab;

  document.getElementById("tab-today").classList.toggle("active-tab", tab==="today");
  document.getElementById("tab-tomorrow").classList.toggle("active-tab", tab==="tomorrow");

  const dateInput = document.getElementById("dashboard-date");
  const baseDate = new Date();
  if(tab === "tomorrow"){
    baseDate.setDate(baseDate.getDate() + 1);
  }
  dateInput.value = baseDate.toISOString().split('T')[0];

  updateDashboardData();
}
window.showTodayMenu = async function(){
const todayStr = formatDate();
const d = new Date();
const prettyDate = d.toLocaleDateString('th-TH', {
  day: 'numeric',
  month: 'long',
  year: 'numeric'
});
document.getElementById("menu-date").innerText = "📅 " + prettyDate;

  const menuDoc = doc(db, "menu", todayStr);
  const menuSnap = await getDoc(menuDoc);

  let data;
  if(menuSnap.exists()){
    data = menuSnap.data();
  } else {
    data = {
      Morning:"❌ ยังไม่กำหนด",
      Noon:"❌ ยังไม่กำหนด",
      Evening:"❌ ยังไม่กำหนด",
      Night:"❌ ยังไม่กำหนด"
    };
  }

  document.getElementById("menu-morning").innerText = data.Morning;
  document.getElementById("menu-noon").innerText = data.Noon;
  document.getElementById("menu-evening").innerText = data.Evening;
  document.getElementById("menu-night").innerText = data.Night;

  document.getElementById("menuModal").style.display = "flex";
}

window.closeMenuModal = function(){
  document.getElementById("menuModal").style.display = "none";
}

function closePopup(){
  document.getElementById("popupAnnounce").style.display = "none";
}

</script>
